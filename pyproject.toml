[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "create-map-idw"
version = "1.0.0"
description = "Weather Map Generation Package for BMKG Papua Barat Daya"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "nashathur"}
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "geopandas>=0.12.0",
    "matplotlib>=3.5.0",
    "scipy>=1.9.0",
    "rioxarray>=0.13.0",
    "thefuzz>=0.22.0",
    "numba>=0.56.0",
    "Pillow>=9.0.0",
    "openpyxl>=3.0.0",
    "xlrd>=2.0.1",
    "pyarrow>=10.0.0",
    "docxtpl>=0.16.0",
    "python-docx>=0.8.11",
    # Dipakai logger.py untuk menulis execution_log.csv lewat GitHub API.
    # Sebelumnya tidak dideklarasikan -- lolos di Colab karena sudah terpasang,
    # tapi gagal pada instalasi bersih di luar Colab.
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Main*"]
